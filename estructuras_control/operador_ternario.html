<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador Ternario</title>
</head>
<body>
    <script>
        var nota = 7;
        console.log("Resultado de mi examen es: ");

        // operador ternario(condicion ? verdadero: falso)
        var resultado = nota >= 5 ? "Suspendido" : "Aprobado";

        console.log("Estoy ", resultado);
    </script>
</body>
</html>
