<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de imagen</title>
    <script>
        function cambiar()
        {
            nombreimagen = document.getElementById('nombreImagen').value;
            document.getElementById('imagen').src = nombreimagen;
        }
    </script>
</head>
<body>
    <img id="imagen" src="img/escudoColegio_fondoTransparente.png" alt="" onclick="cambiar()">
    <input type="text" id="nombreImagen">
    <button onclick="cambiar()">Cambiar imagen</button>
</body>
</html>
